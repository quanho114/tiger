<svg xmlns="http://www.w3.org/2000/svg" class="bot" data-state="idle" viewBox="40 65 240 240" role="img" aria-label="Trợ lý ẩm thực — Sẵn sàng"><title>Trợ lý ẩm thực — Sẵn sàng</title><defs>
<radialGradient id="shell" cx=".34" cy=".24" r=".86"><stop stop-color="#fffaf0"/><stop offset=".57" stop-color="#f2e3cb"/><stop offset="1" stop-color="#d4bea0"/></radialGradient>
<radialGradient id="face" cx=".4" cy=".28" r=".85"><stop stop-color="#fff5df"/><stop offset=".65" stop-color="#ffe7c3"/><stop offset="1" stop-color="#edcc9f"/></radialGradient>
<linearGradient id="orange" x2=".8" y2="1"><stop stop-color="#ffbc61"/><stop offset=".45" stop-color="#ff922b"/><stop offset="1" stop-color="#da651a"/></linearGradient>
<linearGradient id="navy" x2=".7" y2="1"><stop stop-color="#31577d"/><stop offset=".5" stop-color="#173b61"/><stop offset="1" stop-color="#0a2444"/></linearGradient>
<radialGradient id="eye" cx=".32" cy=".25"><stop stop-color="#5d5040"/><stop offset=".4" stop-color="#29251e"/><stop offset="1" stop-color="#100f0d"/></radialGradient>
<radialGradient id="blush"><stop stop-color="#f5a18b" stop-opacity=".68"/><stop offset="1" stop-color="#f5a18b" stop-opacity="0"/></radialGradient>
<linearGradient id="heart" x2=".5" y2="1"><stop stop-color="#ff8d7b"/><stop offset="1" stop-color="#ed4f4f"/></linearGradient>
<filter id="shadow" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="plush" x="-.1" y="-.1" width="1.2" height="1.2"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="12" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComposite in2="SourceAlpha" operator="in"/><feBlend in="SourceGraphic" mode="soft-light"/></filter>
</defs><style>
.bot{--cream:#fff0d9;overflow:visible}.body,.head,.arm-left,.arm-right,.sprout,.eyes,.mouth{transform-box:fill-box;transform-origin:center;transition:transform .32s ease,opacity .18s ease}
.face-expression{opacity:0;transition:opacity .18s ease}
.bot[data-state="idle"] .face-idle,.bot[data-state="happy"] .face-happy,.bot[data-state="excited"] .face-excited,.bot[data-state="wink"] .face-wink,.bot[data-state="curious"] .face-curious,.bot[data-state="surprised"] .face-surprised,.bot[data-state="love"] .face-love,.bot[data-state="thinking"] .face-thinking,.bot[data-state="sleeping"] .face-sleeping,.bot[data-state="speaking"] .face-speaking,.bot[data-state="success"] .face-success,.bot[data-state="error"] .face-error{opacity:1}
.bot .body{animation:breathe 4s ease-in-out infinite}
.bot[data-state="idle"] .face-idle .eyes{animation:blink 5.4s infinite}
.bot[data-state="thinking"] .head{transform:rotate(-5deg)}.bot[data-state="thinking"] .arm-left{transform:translate(33px,-37px) rotate(25deg)}
.bot[data-state="thinking"] .thought{animation:dots 1.4s infinite}
.bot[data-state="speaking"] .face-speaking .mouth{animation:talk .55s ease-in-out infinite alternate}.bot[data-state="speaking"] .head{animation:nod 1.8s ease-in-out infinite}
.bot[data-state="happy"] .arm-right,.bot[data-state="wink"] .arm-right,.bot[data-state="success"] .arm-right{transform:translate(4px,-52px) rotate(-115deg)}
.bot[data-state="excited"] .arm-left{transform:translate(-4px,-51px) rotate(100deg)}.bot[data-state="excited"] .arm-right{transform:translate(4px,-51px) rotate(-100deg)}
.bot[data-state="excited"] .body{animation:bounce .8s ease-in-out infinite}
.bot[data-state="sleeping"] .head{transform:translate(0,7px) rotate(8deg)}.bot[data-state="sleeping"] .body{animation:breathe 5s ease-in-out infinite}
.bot[data-state="error"] .head{transform:rotate(-7deg)}
@keyframes blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.08)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes nod{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes talk{from{transform:scaleY(.55)}to{transform:scaleY(1.15)}}
@keyframes dots{0%,100%{opacity:.3}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.bot *{animation:none!important;transition:none!important}}
</style>
