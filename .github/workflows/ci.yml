name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret Scan (tracked files only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for high-confidence secret patterns
        run: |
          # Fail on likely-committed secrets. Values in .env.example / docs must stay placeholders.
          PATTERN='(SUPABASE_SERVICE_ROLE_KEY\s*=\s*[^ ][^ ]|sk-(live|ant)-[A-Za-z0-9]|xox[bap]-|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----|upstash\.io.*token\s*=\s*[^ ][^ ])'
          if git grep -nEi "$PATTERN" -- . ':!package-lock.json' ':!pnpm-lock.yaml'; then
            echo "ERROR: Possible secret committed to tracked files."
            exit 1
          fi
          echo "PASS: No high-confidence secrets in tracked files."

  validate:
    name: Lint, Typecheck & Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (frozen)
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run server TypeScript typecheck
        run: npm run typecheck:server

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Check architecture boundaries
        run: npm run check:architecture && npm run test:architecture

      - name: Run unit tests
        run: npm run test:unit

      - name: Run server logic tests
        run: npm run test:server

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Mock E2E tests
        run: npm run test:e2e:mock

      - name: Run production build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-public-placeholder
        run: npm run build

      - name: Audit dist bundle for secrets (Invariant V25)
        run: |
          if grep -rnE "SUPABASE_SERVICE_ROLE_KEY|service_role" dist/assets/; then
            echo "ERROR: Leaked server role key or private secret in client dist bundle!"
            exit 1
          fi
          echo "PASS: No server secrets detected in client dist bundle."

  database:
    name: Database Policies & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (frozen)
        run: npm ci

      - name: Start Supabase Local Stack
        run: npx supabase start -x realtime,storage-api,imgproxy

      - name: Mark fresh CI database as disposable
        env:
          DISPOSABLE_TEST_PROVISION_ALLOWED: 'true'
          TEST_ENVIRONMENT: ci_disposable_test
          TEST_INSTANCE_IDENTITY: ci_disposable_test_instance
        run: node scripts/provision-test-db.mjs

      - name: Reset & seed test database
        run: npm run db:reset:test

      - name: Run RLS & RPC Security Policy Tests (Invariant V04)
        run: npm run test:policies

      - name: Start local functions and browser dependencies
        run: |
          npx supabase functions serve --no-verify-jwt &
          timeout 30 bash -c 'until curl -s http://127.0.0.1:54321/functions/v1/public-api/health | grep -q "ok"; do sleep 1; done'
          npx playwright install --with-deps chromium

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

      - name: Run Real E2E tests
        run: npm run test:e2e:real

      - name: Stop Supabase Stack
        if: always()
        run: npx supabase stop
